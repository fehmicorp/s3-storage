limit_req_zone $binary_remote_addr zone=cdn_api_limit:10m rate=30r/s;

map $http_authorization $has_server_key {
    default 0;
    "Bearer ${CDN_SERVER_API_KEY}" 1;
}

map $http_authorization $has_frontend_key {
    default 0;
    "Bearer ${CDN_FRONTEND_API_KEY}" 1;
}

map $arg_X-Amz-Signature $has_presigned_signature {
    default 1;
    "" 0;
}

server {
    listen 80;

    location /healthz {
        return 200 "ok\n";
    }

    location /cdn/ {
        limit_req zone=cdn_api_limit burst=60 nodelay;

        # Allow backend/microservices full access with the server API key.
        if ($has_server_key = 1) {
            proxy_pass http://cdn-storage:9000/;
            break;
        }

        # Allow temporary signed links generated by your backend.
        if ($has_presigned_signature = 1) {
            proxy_pass http://cdn-storage:9000/;
            break;
        }

        # Frontend key can read only (GET/HEAD/OPTIONS).
        if ($has_frontend_key = 1) {
            if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
                return 403;
            }
            proxy_pass http://cdn-storage:9000/;
            break;
        }

        return 401;
    }
}
